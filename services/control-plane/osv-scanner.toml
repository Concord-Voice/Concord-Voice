id = "GO-2026-5932"
reason = "golang.org/x/crypto/openpgp is deprecated, and the advisory has no fixed version. No version bump clears it. Nothing in the build graph imports openpgp: go list -deps ./... finds none, and govulncheck reports the module-level match as not called (verified 2026-10-01)."
