name: Bug report
description: Something in Concord Voice doesn't work as it should.
title: "[BUG] "
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please check the [Known Issues list](https://github.com/Concord-Voice/Concord-Voice/issues/39) first.
        Never include passwords, recovery keys, message contents or other private data. Security problems go to security@concordvoice.com, not here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: app
    attributes:
      label: Which app?
      options:
        - Desktop (macOS)
        - Desktop (Windows)
        - Desktop (Linux)
        - iOS
        - Android
        - Self-hosted server
        - Website
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: In the desktop app, see Settings > About & Updates.
      placeholder: v0.3.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and version
      placeholder: macOS 15.1
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      description: Optional. Remove anything private before you paste.
      render: text
