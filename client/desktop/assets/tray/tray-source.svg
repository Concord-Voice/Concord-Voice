<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Concord Voice tray glyph (#1099, layered for status in the tray-status design):
       crescent, large sparkle and small sparkle, derived from
       branding/Concord-Voice/logos/symbol-transparent-vector.svg. The small
       sparkle path is the brand mark's relative subpath rewritten with an
       absolute origin. The gradient matches the brand mark (#fa709a bottom to
       #ffe13f top, vertical) and is userSpaceOnUse so every layer shares one ramp.
       Regenerate the PNGs with: npm run generate:tray-icons -->
  <defs>
    <linearGradient id="brand" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="0">
      <stop offset="0%" stop-color="#fa709a"/>
      <stop offset="100%" stop-color="#ffe13f"/>
    </linearGradient>
  </defs>
  <g id="crescent"><path fill="url(#brand)" d="M.83 50c0 26.786 21.715 48.5 48.5 48.5 19.997 0 37.164-12.102 44.589-29.38a40.839 40.839 0 0 1-28.152 11.192c-22.646 0-41-18.361-41-41.007 0-17.008 10.357-31.595 25.102-37.805C22.869 1.23.83 22.98.83 50z"/></g>
  <g id="sparkle-lg"><path fill="url(#brand)" d="M54.388 12.864h.118c0 11.185 9.15 20.334 20.334 20.334v.118c-11.185 0-20.334 9.15-20.334 20.334h-.118c0-11.185-9.149-20.334-20.334-20.334v-.118c11.178 0 20.334-9.149 20.334-20.334z"/></g>
  <g id="sparkle-sm"><path fill="url(#brand)" d="M74.895 43.88h.07c0 6.396 5.23 11.626 11.626 11.626v.07c-6.397 0-11.627 5.23-11.627 11.619h-.069c0-6.39-5.23-11.62-11.626-11.62v-.069c6.396 0 11.626-5.23 11.626-11.626z"/></g>
</svg>
