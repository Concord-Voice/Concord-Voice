# OSV-Scanner exceptions for client/desktop/package-lock.json ONLY — osv-scanner
# applies an osv-scanner.toml to lockfiles in its own directory and never to
# child or sibling directories.
#
# Mirror of accepted entries in ./.audit-allowlist.json (canonical; see its `//`
# note). effectiveUntil = review_by; what expiry does is in
# [internal]quality-gate-definition.md ("npm-audit gate").
#
# Scoped by package, exact version, ecosystem and the dev group rather than by
# advisory id: an id-only IgnoredVulns entry would keep muting an advisory that
# is amended onto another package or whose package becomes runtime-reachable —
# the exact cases the allowlist's `package` + `scope: dev` checks fail closed on.
# Each override below fails closed the same way: a version bump, a plain
# production path, or a different package all fall outside it. One exception:
# a package reached through a production optionalDependencies edge is npm
# `devOptional`, which OSV still groups as dev; the npm-audit gate's
# `--omit=dev` check catches that case. What OSV config
# cannot express is "only these ids", so a NEW advisory against the same dev
# package version is muted here too until effectiveUntil; the npm-audit gate,
# which matches by id, still fails on a new HIGH/CRITICAL one.

[[PackageOverrides]]
name = "deepmerge"
version = "4.3.1"
ecosystem = "npm"
group = "dev"
ignore = true
effectiveUntil = 2027-01-29T00:00:00Z
reason = "GHSA-gcqx-w48m-w2h4 (mirror of the .audit-allowlist.json entry). No fixed release exists: deepmerge 4.3.1 is the latest and the advisory lists it as last_affected. Dev-only transitive, reached through build tooling that merges static, package-owned objects, never attacker-supplied input. Re-check for a patched deepmerge or a parent that drops it by review_by."
