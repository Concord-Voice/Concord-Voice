# Concord Voice — subdomain-based nginx reverse proxy
# API + WS Hub:    api.concordvoice.chat   (Cloudflare-proxied)
# Media Plane:     media.concordvoice.chat (direct / DNS only)
# Backward compat: concordvoice.chat       (mirrors api subdomain)
#
# Source-of-truth: infrastructure/deploy/nginx/concordvoice.conf in repo.
# Deploy path: deploy.sh rsyncs to /opt/concord/[internal]nginx/,
# post-rsync.sh has concord-ctl.sh render managed public-edge HSTS ownership
# into nginx/.rendered/concordvoice.conf, then transactionally swaps that fixed
# artifact into /etc/nginx/sites-available/concordvoice (narrow sudoers entry).
#
# Spec ref: [internal]specs/2026-05-09-919-spa-deploy-trust-chain-design.md §5.9
# Trust-model invariants 1, 3, 4 (#919 §3.3): runtime-config flows through deploy,
# not bootstrap; canonical deploy applies every source-landed change.
#
# ⚠ DO NOT EDIT /etc/nginx/sites-available/concordvoice on the server directly.
# Drift will be overwritten on the next deploy. Edit this file in repo, open a
# PR, merge to main; main-cd.yml applies the change on next push to main.

# Hide nginx version in Server header and error pages
server_tokens off;

# ngx_http_headers_module treats '$' as variable syntax even inside quotes.
# geo values are not variable-expanded, so the deploy renderer can preserve a
# literal '$' from an RFC-valid HSTS extension value via this helper variable.
geo $concord_hsts_dollar {
    default "$";
}

# Validate Upgrade header — only allow "websocket" (case-insensitive).
# Rejects h2c and other smuggling vectors by mapping them to empty string.
map $http_upgrade $validated_upgrade {
    default       "";
    ~*^websocket$ websocket;
}

map $validated_upgrade $connection_upgrade {
    default "";
    websocket upgrade;
}

# Validate Host header against allowed hostnames.
# Prevents Host header injection / cache poisoning by rejecting unknown hosts.
# nosemgrep: generic.nginx.security.request-host-used.request-host-used -- $host is the discriminator KEY in a Host-allow-list map (the rule's own recommended remediation); downstream consumers use $validated_host, never $host.
map $host $validated_host {
    concordvoice.chat        concordvoice.chat;
    api.concordvoice.chat    api.concordvoice.chat;
    media.concordvoice.chat  media.concordvoice.chat;
    turn.concordvoice.chat   turn.concordvoice.chat;
    default          "";
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=ws_handshake:10m rate=20r/s;

# Connection limiting (per-IP concurrent connections)
#
# Zones are split per-server-block-class so a hostile client cannot exhaust
# their own budget against one block (e.g., 50 stray turn.* requests) and
# starve legitimate traffic to another block. The `addr` zone serves
# api/media (mirrored DoS pattern), and `turn_addr` is dedicated to the
# turn.* 444-sink block per #886 follow-up.
limit_conn_zone $binary_remote_addr zone=addr:10m;
limit_conn_zone $binary_remote_addr zone=turn_addr:10m;

# Invite codes, friend codes and ownership-reversal tokens ride in the URL path
# and are the credential itself, so the logged path redacts that segment
# (CWE-532). The log formats use this query-free normalized URI.
# nginx error lines cannot use this redaction and may contain complete requests.
# Each public virtual host discards its error log; safe access diagnostics remain.
map $uri $log_uri {
    # The invite code rides in the body on this static route, not in the path.
    /api/v1/invites/join $uri;
    # A revoke names the record UUID (uuid.Parse in the handler), not a code.
    "~^/api/v1/friends/codes/[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$" $uri;
    "~^(?<log_pfx>/api/v1/(?:invites|friends/codes|ownership/reverse)/)[^/]+(?<log_sfx>.*)$" "${log_pfx}<redacted>${log_sfx}";
    default $uri;
}

# Enhanced log format with timing info for monitoring. Logs the method,
# redacted query-free URI and protocol instead of the raw request line.
log_format timed '[$time_local] '
                 '"$request_method $log_uri $server_protocol" $status $body_bytes_sent '
                 'rt=$request_time urt=$upstream_response_time';

# WebSocket handshakes carry client_version in their query string. Keep timing
# fields while logging only the query-free normalized URI.
log_format timed_ws '[$time_local] '
                    '"$request_method $log_uri $server_protocol" $status $body_bytes_sent '
                    'rt=$request_time urt=$upstream_response_time';

# Map scanner User-Agents to a flag for log routing
map $http_user_agent $is_scanner {
    default 0;
    ~*(Nmap|masscan|zgrab|nuclei|nikto|sqlmap|gobuster|dirbuster|wfuzz|hydra|OpenVAS|ZmEu|w3af|Acunetix|Nessus|WPScan) 1;
}

upstream control_plane {
    server 127.0.0.1:8080;
    keepalive 32;
}

upstream media_plane {
    server 127.0.0.1:3000;
    keepalive 16;
}

# ── Cloudflare real IP restoration ────────────────────────────────────────────
# When Cloudflare proxies traffic (api subdomain), $remote_addr is a Cloudflare
# edge IP. This restores the real client IP for rate limiting and proxy forwarding.
# Source: https://www.cloudflare.com/ips/
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# HTTP → HTTPS redirect (certbot will also listen here for challenges)
server {
    error_log /dev/null;
    listen 80;
    listen [::]:80;
    # turn.concordvoice.chat included so the webroot http-01 challenge for turn
    # resolves to this server block (otherwise the validated_host map miss
    # would 444 the request before /.well-known/ matches). See #881.
    server_name concordvoice.chat api.concordvoice.chat media.concordvoice.chat turn.concordvoice.chat;

    # Log every request here in the redacted, query-free format; without a
    # server-level access_log the host's default format logs the raw request line.
    access_log /var/log/nginx/scanner.log timed if=$is_scanner;
    access_log /var/log/nginx/access.log timed;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # WebSocket ticket and client-version queries must not reach either log.
    location ~ ^/api/v1/ws/?$ {
        access_log /var/log/nginx/scanner.log timed_ws if=$is_scanner;
        access_log /var/log/nginx/access.log timed_ws;
        return 301 https://$validated_host$request_uri;
    }

    location / {
        return 301 https://$validated_host$request_uri;
    }

    # Reject requests with unknown Host headers
    if ($validated_host = "") { return 444; }
}

# HTTPS — API + WebSocket Hub (api.concordvoice.chat + bare domain backward compat)
server {
    error_log /dev/null;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.concordvoice.chat concordvoice.chat;

    # TLS — certbot manages these paths. The placeholder selfsigned paths are
    # rewritten to /etc/letsencrypt/live/concordvoice.chat/{fullchain,privkey}.pem
    # by provision-production.sh during initial bootstrap (one-time path swap),
    # and certbot's deploy-hook (renewal-hooks/deploy/copy-certs.sh) refreshes
    # them on each renewal. The deploy path does NOT touch these lines — TLS
    # cert lifecycle remains certbot/provision territory, not deploy territory.
    ssl_certificate     /etc/letsencrypt/live/concordvoice.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/concordvoice.chat/privkey.pem;

    # Modern TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Go owns the complete security-header set for control-plane responses. On
    # managed hosts, concord-ctl renders the two directives at the marker below:
    # nginx hides Go's STS field and emits the canonical deploy policy once at
    # the public edge. That makes HSTS activation independent of container
    # restart ordering while preserving Go ownership in direct/self-host modes,
    # where this committed marker remains a comment.
    # CONCORD_MANAGED_HSTS_OWNER

    # Access logs with timing info; route scanner traffic to separate file
    access_log /var/log/nginx/scanner.log timed if=$is_scanner;
    access_log /var/log/nginx/access.log timed;

    # Request size limit (file uploads)
    client_max_body_size 10M;

    # Per-IP connection limit (mitigate slowloris / connection floods)
    limit_conn addr 50;

    # Reject requests with unknown Host headers
    if ($validated_host = "") { return 444; }

    # ─── Update asset downloads ─────────────────────────────────────
    # ^~ prefix ensures this takes priority over the extension-blocking
    # regex below (which would otherwise drop .zip requests as scanner
    # probes). electron-updater downloads binaries from this path.
    location ^~ /api/v1/updates/ {
        limit_req zone=api burst=50 nodelay;

        proxy_pass http://control_plane;
        proxy_http_version 1.1;
        proxy_set_header Host $validated_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # NOTE: the root-level `location ^~ /spa/` block was removed in #976 when
    # SPA serving moved to Cloudflare Pages (https://spa.concordvoice.chat).
    # The Go /spa/* handler it proxied to no longer exists, so /spa/* on this
    # zone now 404s — which is the intended cutover behavior: already-installed
    # desktop clients holding a cached /spa/<sha7>/ URL 404, self-heal to
    # bundled mode, then recover via /api/v1/client/config (spec §2). See
    # [internal]0015-spa-serving-decouple.md.

    # ─── Scanner / exploit path blocking ───────────────────────────
    # Drop connection immediately (444 = no response body) for common
    # vulnerability scanner paths. These never correspond to real
    # Concord API routes and are always malicious probes.

    # Block probes for config/backup/script files
    location ~* \.(env|git|aws|php|asp|aspx|jsp|cgi|sql|bak|swp|old|orig|save|conf|ini|log|sh|tar|gz|zip|rar)$ {
        access_log off;
        return 444;
    }

    # Block probes for CMS admin panels, Java frameworks, debug endpoints
    location ~* ^/(wp-|wordpress|phpmy|phpmyadmin|admin|login\.action|actuator|cgi-bin|\.vscode|\.DS_Store|xmlrpc|vendor|debug|console|manager|jmx|solr|struts) {
        access_log off;
        return 444;
    }

    # --- Socket.IO (media-plane) ---
    # The $validated_upgrade map (top-of-file) restricts Upgrade values to literal
    # "websocket" only, mapping h2c and any other vector to empty string. This IS
    # the mitigation Semgrep's possible-nginx-h2c-smuggling rule recommends; the
    # rule's pattern cannot detect the upstream filter map. Cross-reference:
    # provision-production.sh ships this same idiom in its nginx heredoc (the
    # source these blocks were unified from).
    location /socket.io/ {
        limit_req zone=api burst=50 nodelay;

        # Node media-plane upstream emits no security headers (unlike the Go
        # control-plane), so this location owns the minimal STS+XCTO pair —
        # mirroring the media/turn server blocks (#2318 review). No duplication:
        # the upstream never sets these.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;

        proxy_pass http://media_plane;
        # nosemgrep: possible-nginx-h2c-smuggling
        proxy_http_version 1.1;
        proxy_set_header Upgrade $validated_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $validated_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --- Auth endpoints (stricter rate limit) ---
    location ~ ^/api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;

        proxy_pass http://control_plane;
        proxy_http_version 1.1;
        proxy_set_header Host $validated_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Control plane WebSocket (voice channel signaling) ---
    # See /socket.io/ block above for the H2C-smuggling mitigation rationale.
    # Do not apply REST request throttling here: each upgrade becomes a
    # long-lived connection. Use a dedicated high-burst handshake limiter
    # so invalid-ticket floods stay bounded without penalizing normal startup.
    location /api/v1/ws {
        limit_req zone=ws_handshake burst=100 nodelay;
        access_log /var/log/nginx/scanner.log timed_ws if=$is_scanner;
        access_log /var/log/nginx/access.log timed_ws;

        proxy_pass http://control_plane;
        # nosemgrep: possible-nginx-h2c-smuggling
        proxy_http_version 1.1;
        proxy_set_header Upgrade $validated_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $validated_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --- Attachment uploads → control plane (body-size override) ---
    # 40M ~= the 32 MiB free-tier MaxAttachmentBytes (entitlements.go) plus
    # protocol overhead. The zone default above is 10M and still governs
    # everything else.
    #
    # Do NOT raise this to cover a 256 MiB premium single-shot upload. It
    # reintroduces DoS surface and is still refused upstream by Cloudflare
    # regardless; premium reaches its entitlement by chunking, not by a bigger
    # cap here.
    #
    # `^~` so this wins over the regex locations above and over `location /api/`.
    #
    # limit_conn/client_body_timeout are tighter than the zone defaults on
    # purpose: nginx buffers the entire body to a temp file BEFORE proxying, so
    # the bytes are paid for ahead of the Go handler's auth and MaxBytesReader.
    # At the zone-wide 50 conns/IP a 40M cap would allow ~2 GiB of in-flight
    # temp files per source; 8 holds it below the pre-override figure.
    location ^~ /api/v1/media/upload/ {
        limit_req zone=api burst=50 nodelay;
        limit_conn addr 8;
        client_body_timeout 30s;

        client_max_body_size 40M;

        proxy_pass http://control_plane;
        proxy_http_version 1.1;
        proxy_set_header Host $validated_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- API routes → control plane ---
    # See /socket.io/ block above for the H2C-smuggling mitigation rationale.
    location /api/ {
        limit_req zone=api burst=50 nodelay;

        proxy_pass http://control_plane;
        # nosemgrep: possible-nginx-h2c-smuggling
        proxy_http_version 1.1;
        proxy_set_header Upgrade $validated_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $validated_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Health endpoint for external monitoring ---
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
        # nginx-owned response — never transits the Go middleware, so it carries
        # the same minimal STS+XCTO pair as the media/turn blocks (#2318 review).
        # Disjoint from Go-proxied responses: no response ever carries two STS values.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # --- Health endpoint (proxies to control-plane for stack-level verification) ---
    # nginx-health above only proves nginx itself is up; this proxies to
    # control-plane:8080/health which is what CF and external monitors hit.
    # See #848 cutover: deploy.yml's external health check fails without
    # this block because the catch-all below redirects /health.
    # Rate limit applies (#880 review): unauthenticated proxy to control-plane
    # is otherwise a cheap amplifier. burst=20 nodelay accommodates monitor
    # bursts (CF Health Check probes, deploy.yml's 18 retries) without 429s
    # for legitimate traffic at 30r/s steady-state.
    location = /health {
        limit_req zone=api burst=20 nodelay;
        access_log off;
        proxy_pass http://control_plane;
        proxy_http_version 1.1;
        proxy_set_header Host $validated_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Unmatched self-host paths stay on the operator's instance.
    location / {
        return 404;
        # Preserve the local TLS policy on nginx-owned denial responses.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}

# HTTPS — Media Plane (media.concordvoice.chat) — DNS-only, NOT Cloudflare-proxied
server {
    error_log /dev/null;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name media.concordvoice.chat;

    ssl_certificate     /etc/letsencrypt/live/concordvoice.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/concordvoice.chat/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;

    access_log /var/log/nginx/media-access.log timed;
    limit_conn addr 50;

    # Reject requests with unknown Host headers
    if ($validated_host = "") { return 444; }

    # Socket.IO (media-plane signaling)
    # See api server block /socket.io/ above for H2C-smuggling mitigation rationale.
    location /socket.io/ {
        limit_req zone=api burst=50 nodelay;

        proxy_pass http://media_plane;
        # nosemgrep: possible-nginx-h2c-smuggling
        proxy_http_version 1.1;
        proxy_set_header Upgrade $validated_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $validated_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Reject everything else
    location / {
        return 444;
    }
}

# HTTPS — TURN domain (turn.concordvoice.chat) — explicit-allowlist 444 sink.
# coturn binds 5349 directly; nginx is not proxying any TURN traffic. This
# block exists purely so that requests with Host: turn.concordvoice.chat on
# port 443 are rejected explicitly instead of falling through to the API
# block (which would serve them under $validated_host = "turn.concordvoice.chat").
# Mirrors the explicit-allowlist intent of the existing 444 patterns. See #886 item #2.
server {
    error_log /dev/null;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name turn.concordvoice.chat;

    # Shares the multi-SAN LE cert with the other server blocks.
    ssl_certificate     /etc/letsencrypt/live/concordvoice.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/concordvoice.chat/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;

    access_log /var/log/nginx/turn-access.log timed;
    # Dedicated turn_addr zone so connection-storm traffic on turn.* doesn't
    # share per-IP budget with api/media (see limit_conn_zone declaration above).
    limit_conn turn_addr 50;

    # Reject requests with unknown Host headers (mirrors api/media blocks for
    # template symmetry; redundant under server_name matching but cheap).
    if ($validated_host = "") { return 444; }

    # Defense-in-depth: allow webroot ACME challenges on port 443 even though
    # the HTTP→HTTPS redirect block above (whose server_name list includes
    # turn.concordvoice.chat per #881) already handles the production challenge path.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Reject everything else
    location / {
        return 444;
    }
}
