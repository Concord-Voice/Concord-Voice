# Concord NATS server configuration
#
# Single-node deployment — JetStream enabled, no cluster routing.
# For multi-node, add a cluster { } block with explicit peer routes.
# Cluster mode requires at least one configured peer route to be
# present at startup.

server_name: concord-nats-1

# Client connections
port: 4222

# HTTP monitoring endpoint
http_port: 8222

# JetStream persistence
jetstream {
  store_dir: "/data/jetstream"
  max_mem: 128M
  max_file: 5G
}

# Logging
log_file: "/dev/stdout"
