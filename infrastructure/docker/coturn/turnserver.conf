# Concord coturn TURN/STUN server configuration
# Docs: https://github.com/coturn/coturn/wiki/turnserver

# ── Network ──────────────────────────────────────────────
# listening-ip is set to 0.0.0.0 inside Docker; external-ip
# is overridden via CLI flag or TURN_EXTERNAL_IP env var.
listening-port=3478
tls-listening-port=5349
min-port=49152
max-port=49252

# ── Authentication ───────────────────────────────────────
# use-auth-secret enables ephemeral HMAC credentials (RFC 5389).
# The control plane generates time-limited username:credential pairs
# using this shared secret — no static passwords stored anywhere.
use-auth-secret
# static-auth-secret is injected via CLI: --static-auth-secret=$TURN_SECRET
realm=concordvoice.chat

# ── Security ─────────────────────────────────────────────
no-multicast-peers
no-cli
stale-nonce=600
fingerprint

# Deny relaying to private/link-local ranges (prevent SSRF via TURN)
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255
# Apply the same local-peer boundary to IPv6-capable relays.
denied-peer-ip=::-::1
denied-peer-ip=::ffff:0:0-::ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# ── Rate Limiting ────────────────────────────────────────
total-quota=100
bps-capacity=0
max-bps=50000000

# ── Logging ──────────────────────────────────────────────
log-file=stdout
no-stdout-log
simple-log
